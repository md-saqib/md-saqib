<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" fill="none" role="img" aria-labelledby="title">
<title id="title">Mohammed Saqib. I build pixel-perfect interfaces, fast Next.js frontends and accessible, responsive UIs.</title>
<style>.sans{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.12em}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes cycle{0%{opacity:0;transform:translateY(8px)}3.0%{opacity:1;transform:none}17.0%{opacity:1;transform:none}20.0%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}@keyframes scroll{to{transform:translateX(-1617px)}}@keyframes drift{50%{transform:translate(-40px,14px)}}.rise{animation:rise 1s cubic-bezier(.22,1,.36,1) both}.fade{animation:fade .8s ease-out both}.p{opacity:0}.p0{opacity:1}.p{animation:cycle 15s cubic-bezier(.22,1,.36,1) infinite both}.band{animation:scroll 53.9s linear infinite}.blob{animation:drift 14s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<clipPath id="clip"><rect width="840" height="280" rx="12"/></clipPath>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#1f2328" stroke-opacity=".07"/></pattern>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 40) scale(560 300)"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fade"><rect width="840" height="280" fill="url(#glow)"/></mask>
<radialGradient id="b1"><stop stop-color="#7c3aed" stop-opacity="0.38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop stop-color="#2563eb" stop-opacity="0.3"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient><radialGradient id="b3"><stop stop-color="#db2777" stop-opacity="0.26"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
<linearGradient id="brand" x1="0" x2="840" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<linearGradient id="name" x1="300" x2="480" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<linearGradient id="edge" x1="0" x2="840" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".1" stop-color="#fff"/><stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="edges"><rect y="216" width="840" height="64" fill="url(#edge)"/></mask>
</defs>
<g clip-path="url(#clip)">
<rect width="840" height="280" fill="#ffffff"/>
<g class="blob"><ellipse cx="700" cy="40" rx="260" ry="170" fill="url(#b1)"/></g>
<g class="blob" style="animation-delay:-5s"><ellipse cx="520" cy="230" rx="240" ry="140" fill="url(#b2)"/></g>
<g class="blob" style="animation-delay:-9s"><ellipse cx="820" cy="210" rx="200" ry="130" fill="url(#b3)"/></g>
<rect width="840" height="280" fill="url(#grid)" mask="url(#fade)"/>
<rect width="840" height="3" fill="url(#brand)"/>
</g>
<rect x=".5" y=".5" width="839" height="279" rx="11.5" stroke="#d8dee4"/>
<text class="mono fade" x="28" y="46" font-size="11" fill="#59636e"><tspan fill="#7c3aed">✦</tspan><tspan dx="10">FRONTEND ENGINEER</tspan><tspan dx="10" fill="#db2777">•</tspan><tspan dx="10">BENGALURU, INDIA</tspan></text>
<text class="sans rise" x="26" y="126" font-size="60" font-weight="700" letter-spacing="-.04em" fill="#1f2328" style="animation-delay:.1s">Mohammed <tspan fill="url(#name)">Saqib</tspan><tspan fill="#db2777">.</tspan></text>
<text class="sans rise" x="28" y="178" font-size="24" font-weight="400" fill="#59636e" textLength="72" lengthAdjust="spacing" style="animation-delay:.25s">I build</text>
<text class="sans p p0" x="112" y="178" font-size="24" font-weight="600" letter-spacing="-.01em" fill="#2563eb" style="animation-delay:0s">pixel-perfect interfaces.</text><text class="sans p p1" x="112" y="178" font-size="24" font-weight="600" letter-spacing="-.01em" fill="#7c3aed" style="animation-delay:3s">fast Next.js frontends.</text><text class="sans p p2" x="112" y="178" font-size="24" font-weight="600" letter-spacing="-.01em" fill="#db2777" style="animation-delay:6s">accessible, responsive UIs.</text><text class="sans p p3" x="112" y="178" font-size="24" font-weight="600" letter-spacing="-.01em" fill="#0891b2" style="animation-delay:9s">Drupal themes that scale.</text><text class="sans p p4" x="112" y="178" font-size="24" font-weight="600" letter-spacing="-.01em" fill="#1a7f37" style="animation-delay:12s">AI chatbots &amp; assistants.</text>
<path d="M0 216.5H840" stroke="#d8dee4"/>
<g clip-path="url(#clip)" mask="url(#edges)"><g class="band"><text class="mono" x="0" y="252" font-size="12" fill="#59636e" textLength="1617" lengthAdjust="spacing" xml:space="preserve">REACT  <tspan fill="#2563eb">✦</tspan>  NEXT.JS  <tspan fill="#7c3aed">✦</tspan>  TYPESCRIPT  <tspan fill="#db2777">✦</tspan>  JAVASCRIPT  <tspan fill="#0891b2">✦</tspan>  TAILWIND CSS  <tspan fill="#1a7f37">✦</tspan>  NODE.JS  <tspan fill="#bf8700">✦</tspan>  GRAPHQL  <tspan fill="#2563eb">✦</tspan>  PRISMA  <tspan fill="#7c3aed">✦</tspan>  DRUPAL  <tspan fill="#db2777">✦</tspan>  SHOPIFY  <tspan fill="#0891b2">✦</tspan>  MONGODB  <tspan fill="#1a7f37">✦</tspan>  MYSQL  <tspan fill="#bf8700">✦</tspan>  AWS  <tspan fill="#2563eb">✦</tspan>  GCP  <tspan fill="#7c3aed">✦</tspan>  FIREBASE  <tspan fill="#db2777">✦</tspan>  NGINX  <tspan fill="#0891b2">✦</tspan>  </text><text class="mono" x="1617" y="252" font-size="12" fill="#59636e" textLength="1617" lengthAdjust="spacing" xml:space="preserve">REACT  <tspan fill="#2563eb">✦</tspan>  NEXT.JS  <tspan fill="#7c3aed">✦</tspan>  TYPESCRIPT  <tspan fill="#db2777">✦</tspan>  JAVASCRIPT  <tspan fill="#0891b2">✦</tspan>  TAILWIND CSS  <tspan fill="#1a7f37">✦</tspan>  NODE.JS  <tspan fill="#bf8700">✦</tspan>  GRAPHQL  <tspan fill="#2563eb">✦</tspan>  PRISMA  <tspan fill="#7c3aed">✦</tspan>  DRUPAL  <tspan fill="#db2777">✦</tspan>  SHOPIFY  <tspan fill="#0891b2">✦</tspan>  MONGODB  <tspan fill="#1a7f37">✦</tspan>  MYSQL  <tspan fill="#bf8700">✦</tspan>  AWS  <tspan fill="#2563eb">✦</tspan>  GCP  <tspan fill="#7c3aed">✦</tspan>  FIREBASE  <tspan fill="#db2777">✦</tspan>  NGINX  <tspan fill="#0891b2">✦</tspan>  </text></g></g>
</svg>
